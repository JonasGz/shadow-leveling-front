# Flow: Dashboard Home — verifica métricas do dia
#
# Rode via wrapper (abre o projeto no Expo Go antes):
#   .maestro/run.sh 03_dashboard.yaml

appId: host.exp.Exponent
---
- runFlow: subflows/login.yaml

# Garante que está na Home
- tapOn:
    text: "Home"

# Saudação — verifica que existe alguma (regex cobre os três casos)
- assertVisible:
    text: ".*,(.*)"
    regex: true

# Elementos fixos da Home
- assertVisible: "TREINOS DO DIA"
- assertVisible: "VER TUDO"

# Tab bar
- assertVisible: "Home"
- assertVisible: "Histórico"
- assertVisible: "Perfil"
