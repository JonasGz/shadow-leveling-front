# Flow: Editar nickname e verificar reflexo na header da Home
#
# Rode via wrapper (abre o projeto no Expo Go antes):
#   .maestro/run.sh 01_nickname.yaml

appId: host.exp.Exponent
---
- runFlow: subflows/login.yaml

# Navega para a tab Perfil pelo ícone (a tab bar do React Navigation
# transforma o texto via CSS e o accessibility label varia entre versões).
- tapOn: "👤"

- assertVisible: "Caçador"

# Toca no ícone de edição do nome (primeiro ✎ da tela)
- tapOn:
    text: "✎"
    index: 1

# Modal de edição deve aparecer
- assertVisible: "Editar nick"

# Limpa e digita novo nick
- eraseText
- inputText: ${NICKNAME}

# Salva
- tapOn:
    text: "Salvar"

# Toast de confirmação
- assertVisible: "Nick atualizado."

# Navega para Home pelo ícone e verifica nick na saudação
- tapOn: "🏠"

- assertVisible: ${NICKNAME}
